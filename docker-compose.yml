services:
  app:
    build: .
    container_name: debrid_downloader
    ports:
      - "5175:5174"
    env_file:
      - server/.env
    environment:
      - PORT=5174
    depends_on:
      - jackett
    restart: unless-stopped

  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - AUTO_UPDATE=true
    volumes:
      - jackett_config:/config
      - jackett_downloads:/downloads
    ports:
      - "9117:9117"
    restart: unless-stopped

volumes:
  jackett_config:
  jackett_downloads:
